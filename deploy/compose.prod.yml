name: todo-app-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    networks:
      - backend

    mem_limit: 128m
    shm_size: 32m

  migrate:
    image: "${API_IMAGE:?API_IMAGE is required}"
    restart: "no"
    init: true

    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"

    command:
      - alembic
      - -c
      - /app/services/api_gateway/alembic.ini
      - upgrade
      - head

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

    mem_limit: 160m

    profiles:
      - tools

  api:
    image: "${API_IMAGE:?API_IMAGE is required}"
    restart: unless-stopped
    init: true

    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_EXPIRES_MINUTES: "${JWT_EXPIRES_MINUTES:-30}"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8000/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

    networks:
      - backend

    mem_limit: 160m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    init: true

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      - backend

    mem_limit: 32m

volumes:
  postgres_data:

networks:
  backend:
