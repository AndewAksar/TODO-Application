name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
        PYTHONPATH: .

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        service-path:
          - "."

    defaults:
      run:
        working-directory: ${{ matrix.service-path }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
            enable-cache: true
            cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra api --extra test

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy (type check)
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest -q -m "not integration and not flaky"

  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker tests (api-tooling)
        run: make test

  migration-check:
      runs-on: ubuntu-latest
      timeout-minutes: 15
      env:
          COMPOSE_PROJECT_NAME: ci-migration-check

      steps:
          - name: Checkout
            uses: actions/checkout@v4

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Ensure clean compose state
            run: docker compose down -v --remove-orphans

          - name: Start postgres on clean volume
            run: docker compose up -d postgres

          - name: Wait for postgres health
            shell: bash
            run: |
                set -euo pipefail

                cid="$(docker compose ps -q postgres)"
                if [ -z "$cid" ]; then
                    echo "postgres container not found"
                    exit 1
                fi

                for i in $(seq 1 30); do
                    status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$cid")"
                    if [ "$status" = "healthy" ]; then
                        echo "postgres is healthy"
                        exit 0
                    fi
                    echo "waiting for postgres health... current status: $status"
                    sleep 2
                done

                echo "postgres did not become healthy in time"
                docker compose ps
                docker compose logs postgres
                exit 1

          - name: Apply Alembic migrations via tooling container
            run: docker compose --profile test run --rm --no-deps api-tooling alembic upgrade head

          - name: Down
            if: always()
            run: docker compose down -v --remove-orphans

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # На ubuntu-latest docker compose уже есть, но Buildx полезен для кеша
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compose config (lint)
        run: docker compose config

      - name: Build images
        run: docker compose build

      - name: Up (detached)
        run: docker compose up -d

      - name: Wait for health
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED=("postgres" "zookeeper" "kafka" "api")

          health_of() {
            local svc="$1"
            local cid
            cid="$(docker compose ps -q "$svc" 2>/dev/null || true)"
            if [[ -z "$cid" ]]; then
              echo "missing"
              return 0
            fi

            docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid" 2>/dev/null || echo "unknown"
          }

          echo "Waiting for services to become healthy..."
          for i in {1..90}; do
            all_ok=1

            for svc in "${REQUIRED[@]}"; do
              status="$(health_of "$svc")"
              if [[ "$status" != "healthy" && "$status" != "running" ]]; then
                all_ok=0
                echo "  - $svc: $status"
              fi
            done

            if [[ "$all_ok" == "1" ]]; then
              echo "All required services are ready."
              exit 0
            fi

            sleep 2
          done

          echo "Timed out waiting for health."
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1

      - name: Smoke HTTP (api + nginx)
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8008/health
          curl -fsS http://localhost:8080/ | head -n 20

      # OBSERVABILITY: protected endpoint must not be accessible without auth
      - name: Observability check — unauthorized access
        run: |
          set -euo pipefail
          code=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:8008/auth/me)
          echo "GET /auth/me without token returned HTTP $code"

          if [ "$code" != "401" ]; then
            echo "Expected 401 Unauthorized, got $code"
            exit 1
          fi

      - name: Show compose ps
        if: always()
        run: docker compose ps

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Down
        if: always()
        run: docker compose down -v
